<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Journalist — IT новости</title>
    <meta name="description" content="IT новости от AI-journalist. Свежие публикации о технологиях, разработке и ИИ.">
    <meta name="theme-color" content="#1a1a2e">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/styles.css">
    <link rel="icon" type="image/svg+xml" href="/icon.svg">
</head>
<body>
    <header>
        <div class="header-left">
            <h1>AI Journalist</h1>
            <p class="subtitle">IT-новости и обзоры</p>
        </div>
        <div class="header-right">
            <div class="header-stats">
                <span id="article-count">0</span> <span id="article-count-label"></span>
            </div>
            <button class="theme-toggle" id="theme-toggle" aria-label="Переключить тему">🌙</button>
        </div>
    </header>

    <!-- Mobile: search + filter button -->
    <div class="mobile-controls">
        <div class="search-box">
            <input type="text" id="search-mobile" placeholder="Поиск..." autocomplete="off">
        </div>
        <button class="filter-toggle-btn" id="filter-toggle-btn" aria-label="Фильтры">
            🏷️ Теги
        </button>
    </div>

    <!-- Mobile: filter drawer overlay -->
    <div class="filter-overlay" id="filter-overlay">
        <div class="filter-drawer" id="filter-drawer">
            <div class="filter-drawer-header">
                <h2>Фильтры по тегам</h2>
                <button class="filter-close-btn" id="filter-close-btn" aria-label="Закрыть">✕</button>
            </div>
            <div class="filter-drawer-content">
                <div class="search-box filter-search">
                    <input type="text" id="search-drawer" placeholder="Поиск по тегам..." autocomplete="off">
                </div>
                <div class="filters" id="filters-drawer">
                    <button class="filter-btn active" data-category="all">Все</button>
                </div>
            </div>
        </div>
    </div>

    <div class="page-layout">
        <!-- Desktop: sidebar with filters -->
        <aside class="sidebar" id="sidebar">
            <!-- Search first -->
            <div class="search-box sidebar-search">
                <input type="text" id="search-desktop" placeholder="Поиск..." autocomplete="off">
            </div>
            <!-- Then tags heading -->
            <div class="sidebar-header">
                <h3>🏷️ Теги</h3>
            </div>
            <div class="filters" id="filters-desktop">
                <button class="filter-btn active" data-category="all">Все</button>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main-content">
            <div id="articles-grid" class="articles-grid">
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Загрузка статей...</p>
                </div>
            </div>
            <div id="end-message"></div>
        </main>
    </div>

    <!-- Модальное окно статьи -->
    <dialog id="article-modal">
        <div class="modal-content">
            <button id="close-modal" class="close-btn" aria-label="Закрыть">✕</button>
            <div id="modal-body"></div>
        </div>
    </dialog>

    <footer>
        <p><a href="https://github.com/JeBance/AI-journalist" target="_blank" rel="noopener" class="footer-icon" aria-label="GitHub"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg></a> <a href="https://t.me/JeBanceOnline" target="_blank" rel="noopener" class="footer-icon" aria-label="Telegram"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zM6.27 9.32l-.19 2.76c.27 0 .39-.12.53-.26l1.27-1.23 2.64 1.95c.48.27.83.13.96-.45l1.74-8.21c.16-.63-.24-.88-.65-.7L2.35 7.2c-.6.24-.59.57-.11.72l2.6.81 6.03-3.8c.28-.17.54-.08.33.11z"/></svg></a> — Обновлено: <span id="last-updated">—</span></p>
    </footer>

    <script src="/idb-cache.js"></script>
    <script src="/app.js"></script>
</body>
</html>
